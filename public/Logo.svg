<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 68" width="920" height="136">
  <defs>
    <linearGradient id="blueTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Pure Typography Wordmark - No Car Logo / Crest -->
  <g transform="translate(0, 10)">
    <!-- Primary Brand Title -->
    <text y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0F172A">SHRI VARI </tspan>
      <tspan fill="url(#blueTextGrad)">TRAVELS</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <g transform="translate(1, 50)">
      <text y="5" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="2.8" fill="#D97706">
        CHENNAI
      </text>
      <text x="74" y="5" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2" fill="#64748B">
        • TIRUPATI &amp; OUTSTATION CABS
      </text>
    </g>
