<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 90" width="1140" height="180">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Left Emblem / Crest -->
  <g transform="translate(8, 6)">
    <!-- Subtle drop-shadow rect -->
    <rect x="0" y="4" width="76" height="76" rx="22" fill="#1E3A8A" opacity="0.2" />
    <!-- Main Crest Background -->
    <rect x="0" y="2" width="76" height="76" rx="22" fill="url(#blueGrad)" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- Divine Tirupati Balaji Namam / Sacred Tilak at top center -->
    <g transform="translate(38, 18)">
      <!-- White U-shape Tiruman Namam -->
      <path d="M-10 0 C-8 8, -5 15, 0 17 C5 15, 8 8, 10 0 L6 0 C4 6, 2 11, 0 12 C-2 11, -4 6, -6 0 Z" fill="#FFFFFF" />
      <!-- Central Sacred Kasturi Red/Saffron Tilak (Sri Churnam) -->
      <path d="M-1.5 -2 L1.5 -2 L0.8 13 L-0.8 13 Z" fill="url(#saffronGrad)" />
      <circle cx="0" cy="-3" r="1.8" fill="#F59E0B" />
    </g>

    <!-- Dynamic Road Arc / Swoop -->
    <path d="M8 58 C 22 60, 46 48, 68 36" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M12 64 C 28 66, 52 54, 70 44" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Modern Tour Cab / Innova Silhouette -->
    <path d="M16 52 C 20 44, 28 38, 38 36 L 50 36 C 57 36, 62 42, 65 50 L 66 54 C 67 56, 65 58, 62 58 L 14 58 C 12 58, 11 56, 12 54 Z" fill="#FFFFFF" />
    <!-- Tinted Glass -->
    <path d="M29 47 L 36 39 L 46 39 L 45 47 Z" fill="#1E3A8A" opacity="0.95" />
    <path d="M48 47 L 49 39 L 57 39 C 59 42, 61 45, 62 47 Z" fill="#1E3A8A" opacity="0.95" />
    <!-- Wheels -->
    <circle cx="24" cy="58" r="6.5" fill="#0F172A" />
    <circle cx="24" cy="58" r="3" fill="#F8FAFC" />
    <circle cx="54" cy="58" r="6.5" fill="#0F172A" />
    <circle cx="54" cy="58" r="3" fill="#F8FAFC" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 10)">
    <!-- Brand Name with Relative Tspans for unclipped text flow -->
    <text y="40" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#0F172A">SHRI VARI </tspan>
      <tspan fill="#2563EB">TRAVELS</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <g transform="translate(2, 58)">
      <text y="6" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="2.5" fill="#D97706">
        CHENNAI
      </text>
      <text x="72" y="6" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.8" fill="#64748B">
        • TIRUPATI &amp; OUTSTATION CABS
      </text>
    </g>
  </g>
</svg>