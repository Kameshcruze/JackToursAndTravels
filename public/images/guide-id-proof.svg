<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200" fill="none">
  <defs>
    <!-- Passport Background Gradient -->
    <linearGradient id="passportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#05101f" />
    </linearGradient>

    <!-- Gold Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>

    <filter id="aadhaarShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 1. Indian Passport (Tilted in Background) -->
  <g transform="translate(145, 12) rotate(8)" filter="url(#cardShadow)">
    <!-- Passport Cover -->
    <rect width="96" height="146" rx="6" fill="url(#passportBg)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Gold Embossed Text: Bharat Ganarajya / Republic of India -->
    <text x="48" y="18" fill="url(#goldGrad)" font-size="5" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">भारत गणराज्य</text>
    <text x="48" y="26" fill="url(#goldGrad)" font-size="4.2" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.6">REPUBLIC OF INDIA</text>

    <!-- Ashoka Lion Emblem -->
    <g transform="translate(36, 42) scale(0.6)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />
      <path d="M14 16 L26 16 M16 22 L24 22 M18 28 L22 28 M20 10 L20 30" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
      <polygon points="20,12 23,17 17,17" fill="url(#goldGrad)" />
      <polygon points="15,20 18,24 13,25" fill="url(#goldGrad)" />
      <polygon points="25,20 22,24 27,25" fill="url(#goldGrad)" />
    </g>

    <!-- Bottom Text: Passport -->
    <text x="48" y="112" fill="url(#goldGrad)" font-size="5" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">पासपोर्ट</text>
    <text x="48" y="121" fill="url(#goldGrad)" font-size="5" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">PASSPORT</text>

    <!-- Gold decorative border line -->
    <rect x="5" y="6" width="86" height="134" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.4" />
  </g>

  <!-- 2. Indian Aadhaar Card (Prominently Overlapping in Front) -->
  <g transform="translate(10, 48) rotate(-4)" filter="url(#aadhaarShadow)">
    <!-- Base Card Body -->
    <rect width="168" height="106" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Top Tricolor Header Band -->
    <path d="M0 8 C0 3.5 3.5 0 8 0 L160 0 C164.5 0 168 3.5 168 8 L168 18 L0 18 Z" fill="#ff9933" />
    <rect y="18" width="168" height="4" fill="#ffffff" />
    <rect y="22" width="168" height="3" fill="#138808" />

    <!-- Header Text: Government of India -->
    <g transform="translate(42, 6)">
      <text x="42" y="8" fill="#1e293b" font-size="5.5" font-family="system-ui, sans-serif" font-weight="800" text-anchor="middle">भारत सरकार</text>
      <text x="42" y="15" fill="#334155" font-size="4" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.4">GOVERNMENT OF INDIA</text>
    </g>

    <!-- National Emblem on Top Left -->
    <circle cx="18" cy="11" r="5" fill="#f8fafc" stroke="#64748b" stroke-width="0.5" />
    <path d="M18 7 L18 15 M15 10 L21 10" stroke="#0f172a" stroke-width="0.8" />

    <!-- User Photo Frame -->
    <rect x="12" y="32" width="34" height="44" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- User Silhouette -->
    <circle cx="29" cy="46" r="7" fill="#94a3b8" />
    <path d="M18 70 C18 58 40 58 40 70 Z" fill="#94a3b8" />

    <!-- Cardholder Info Lines -->
    <g transform="translate(54, 34)">
      <rect x="0" y="2" width="55" height="4.5" rx="2" fill="#0f172a" opacity="0.8" />
      <rect x="0" y="11" width="45" height="3.5" rx="1.5" fill="#64748b" opacity="0.6" />
      <rect x="0" y="18" width="40" height="3.5" rx="1.5" fill="#64748b" opacity="0.6" />
      <rect x="0" y="25" width="50" height="3.5" rx="1.5" fill="#64748b" opacity="0.6" />
      
      <!-- Gender / DOB -->
      <rect x="0" y="33" width="35" height="3" rx="1.5" fill="#94a3b8" opacity="0.5" />
    </g>

    <!-- Aadhaar Fingerprint Sun Logo & QR Code -->
    <g transform="translate(126, 32)">
      <!-- Sun Rays Emblem -->
      <circle cx="16" cy="12" r="8" fill="#fee2e2" />
      <circle cx="16" cy="12" r="5" fill="#ef4444" opacity="0.85" />
      <path d="M16 2 L16 6 M16 18 L16 22 M6 12 L10 12 M22 12 L26 12" stroke="#ea580c" stroke-width="1.2" />
      
      <!-- QR Code Square Box -->
      <rect x="4" y="25" width="24" height="24" rx="2" fill="#0f172a" />
      <rect x="6" y="27" width="8" height="8" fill="#ffffff" />
      <rect x="8" y="29" width="4" height="4" fill="#0f172a" />
      <rect x="18" y="27" width="8" height="8" fill="#ffffff" />
      <rect x="20" y="29" width="4" height="4" fill="#0f172a" />
      <rect x="6" y="39" width="8" height="8" fill="#ffffff" />
      <rect x="8" y="41" width="4" height="4" fill="#0f172a" />
      <rect x="18" y="39" width="6" height="6" fill="#ffffff" />
    </g>

    <!-- Bottom Red Divider Line -->
    <line x1="8" y1="84" x2="160" y2="84" stroke="#dc2626" stroke-width="1" />

    <!-- Masked Aadhaar Number -->
    <text x="84" y="97" fill="#0f172a" font-size="9" font-family="'Courier New', monospace" font-weight="900" text-anchor="middle" letter-spacing="2">
      XXXX XXXX 1234
    </text>
  </g>
</svg>
