<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="1040" height="200" fill="none">
  <defs>
    <!-- Royal Navy Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Polished Luxury Gold Gradient -->
    <linearGradient id="goldLustre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Warm Highlight Gold -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Saffron / Sri Churnam Gradient -->
    <linearGradient id="saffron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= LEFT EMBLEM / CREST ================= -->
  <g transform="translate(12, 8)" filter="url(#shadow)">
    <!-- Outer Golden Ring -->
    <circle cx="42" cy="42" r="41" fill="none" stroke="url(#goldLustre)" stroke-width="2" />
    
    <!-- Inner Medallion Background -->
    <circle cx="42" cy="42" r="39" fill="url(#emblemBg)" />
    
    <!-- Thin Inner Accent Ring -->
    <circle cx="42" cy="42" r="36" fill="none" stroke="#FDE047" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 3" />

    <!-- Sacred Temple Gopuram & Balaji Kalasam (Spiritual Apex) -->
    <g transform="translate(42, 16)">
      <!-- Peak Golden Kalasam / Jewel -->
      <circle cx="0" cy="0" r="2.2" fill="url(#goldLight)" />
      <path d="M-1.5 2 L1.5 2 L0.8 5 L-0.8 5 Z" fill="url(#goldLustre)" />

      <!-- Top Tier Gopuram Roof -->
      <path d="M-6 8 C-3 6.5, 3 6.5, 6 8 L7 10 L-7 10 Z" fill="url(#goldLustre)" />
      
      <!-- Middle Gopuram Sanctuary Arch -->
      <path d="M-10 13 C-5 11, 5 11, 10 13 L11 16 L-11 16 Z" fill="url(#goldLustre)" />
      
      <!-- Sacred White Tirupati Namam (Tiruman) in the Sanctum -->
      <path d="M-7 18 C-5.5 24, -3 28, 0 30 C3 28, 5.5 24, 7 18 L4.5 18 C3 22, 1.8 25.5, 0 26.5 C-1.8 25.5, -3 22, -4.5 18 Z" fill="#FFFFFF" />
      
      <!-- Central Sacred Red Kasturi Tilak (Sri Churnam) -->
      <path d="M-1 16 L1 16 L0.6 28 L-0.6 28 Z" fill="url(#saffron)" />
    </g>

    <!-- Dynamic Highway Ribbon Arc (Smooth Journey Swoop) -->
    <path d="M10 63 C 24 67, 56 61, 74 44" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />
    <path d="M12 68 C 28 72, 58 64, 75 48" stroke="url(#goldLustre)" stroke-width="3" stroke-linecap="round" />

    <!-- Sleek Modern Luxury Cab / Tour Vehicle Silhouette -->
    <g transform="translate(18, 50)">
      <!-- Car Body -->
      <path d="M4 14 C 7 7, 13 2, 21 1 L 32 1 C 37 1, 41 5, 43 11 L 45 15 C 46 17, 44 19, 41 19 L 2 19 C 0.5 19, -0.5 17, 0.5 15 Z" fill="#FFFFFF" />
      <!-- Aerodynamic Tinted Windows -->
      <path d="M13 10 L 19 3.5 L 28 3.5 L 27 10 Z" fill="#0F172A" opacity="0.9" />
      <path d="M29 10 L 30 3.5 L 36 3.5 C 38 6, 39.5 8, 40 10 Z" fill="#0F172A" opacity="0.9" />
      <!-- Wheels with Chrome Hubs -->
      <circle cx="10" cy="19" r="4.5" fill="#0B132B" stroke="url(#goldLustre)" stroke-width="1" />
      <circle cx="10" cy="19" r="1.8" fill="#FFFFFF" />
      <circle cx="35" cy="19" r="4.5" fill="#0B132B" stroke="url(#goldLustre)" stroke-width="1" />
      <circle cx="35" cy="19" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Divine Golden Sparkle Star (Top Right of Crest) -->
    <path d="M66 22 L67.5 26 L71.5 27.5 L67.5 29 L66 33 L64.5 29 L60.5 27.5 L64.5 26 Z" fill="url(#goldLight)" />
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->
  <g transform="translate(108, 14)">
    <!-- Main Brand Title: SHRI VARI -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em" fill="#0B132B">
      SHRI VARI
    </text>

    <!-- Accent Word: TRAVELS with Metallic Gold Gradient -->
    <text x="186" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="0.06em" fill="url(#goldLustre)">
      TRAVELS
    </text>

    <!-- Elegant Divider Rule with Golden Center Accent -->
    <g transform="translate(0, 48)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#E2E8F0" stroke-width="1" />
      <line x1="180" y1="0" x2="250" y2="0" stroke="url(#goldLustre)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Subtitle / Prestige Tagline -->
    <g transform="translate(1, 65)">
      <!-- CHENNAI -->
      <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9.5" letter-spacing="0.28em" fill="#B45309">
        CHENNAI
      </text>

      <!-- Diamond Separator -->
      <polygon points="68,-3 70,-6 72,-3 70,0" fill="#F59E0B" />

      <!-- PILGRIMAGE & OUTSTATION CABS -->
      <text x="80" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.18em" fill="#475569">
        VIP TIRUPATI &amp; OUTSTATION CABS
      </text>
    </g>

    <!-- Small 5-Star Rating Badge in Gold -->
    <g transform="translate(345, 12)">
      <rect x="0" y="0" width="46" height="17" rx="8.5" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
      <text x="7" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#B45309">
        ★ 4.9
      </text>
    </g>
  </g>
</svg>
